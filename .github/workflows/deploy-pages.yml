# Builds the site on every push to main and publishes dist/ to the gh-pages
# branch, which GitHub Pages serves (Settings → Pages → Deploy from a branch →
# gh-pages / root). Normal commits on top of gh-pages; no force-push.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Publish dist/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin gh-pages; then
            git worktree add -B gh-pages ../pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages ../pages
          fi
          find ../pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. ../pages/
          cd ../pages
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -m "Deploy ${GITHUB_SHA::7} from main"
          git push origin gh-pages
